name: Source maintenance checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/verify-sources.py
      - run: python3 -m unittest discover -s tests
      - run: ./scripts/check-no-proprietary-assets.sh
      - run: git diff --check
